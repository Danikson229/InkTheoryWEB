<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#15171c" />
    <meta name="description" content="Lyvero Studio creates modern, responsive websites for small businesses. Discover our web design services and portfolio." />
    <meta property="og:image" content="images/logo.jpg" />
    <title>Lyvero Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="glow" aria-hidden="true"></div>
    <div class="wrap">
      <header id="hdr">
        <a class="logo" href="#top" aria-label="Lyvero Studio">
          <svg class="mark" viewBox="0 0 573 495" aria-hidden="true">
            <path fill="#fff" d="M0 0H60A97 97 0 0 1 157 97V334H357V495H0Z" />
            <rect class="sq" x="409" y="334" width="164" height="161" />
          </svg>
          <span>Lyvero Studio</span>
        </a>
        <nav id="menu" aria-label="Menu">
          <a href="#works" data-i18n="nav_works"></a><a href="#services" data-i18n="nav_services"></a><a href="#pricing" data-i18n="nav_pricing"></a><a href="#process" data-i18n="nav_process"></a><a href="#contact" data-i18n="nav_contact"></a>
        </nav>
        <div class="lang" id="lang" role="group" aria-label="Language">
          <button type="button" data-lang="en">EN</button><button type="button" data-lang="ru">RU</button><button type="button" data-lang="et">ET</button>
        </div>
        <button class="burger" id="burger" type="button" aria-label="Menu" aria-expanded="false" aria-controls="menu">
          <span></span><span></span><span></span>
        </button>
      </header>

      <main id="top">
        <div class="hero">
          <h1 data-i18n="hero_h"></h1>
          <p data-i18n="hero_p"></p>
          <div class="cta">
            <a class="btn" href="#works" data-i18n="btn_works"></a><a class="btn ghost" href="#contact" data-i18n="btn_contact"></a>
          </div>
        </div>


        <section id="works">
          <h2 data-i18n="works_h"></h2>
          <p class="lead" data-i18n="works_lead"></p>
          <div class="filters" id="filters" role="group"></div>
          <div class="grid" id="grid"></div>
        </section>

        <section id="services">
          <h2 data-i18n="services_h"></h2>
          <p class="lead" data-i18n="services_lead"></p>
          <div class="cols">
            <div><h3 data-i18n="s1h"></h3><p data-i18n="s1p"></p></div>
            <div><h3 data-i18n="s2h"></h3><p data-i18n="s2p"></p></div>
            <div><h3 data-i18n="s3h"></h3><p data-i18n="s3p"></p></div>
            <div><h3 data-i18n="s4h"></h3><p data-i18n="s4p"></p></div>
          </div>
        </section>

        <section id="pricing">
          <h2 data-i18n="pricing_h"></h2>
          <p class="lead" data-i18n="pricing_lead"></p>
          <div class="plans">
            <div class="plan tilt">
              <h3 data-i18n="p1h"></h3>
              <p data-i18n="p1p"></p>
              <div class="price"><small data-i18n="from"></small> €100 <span class="usd">≈ $110</span></div>
              <ul><li data-i18n="p1f1"></li><li data-i18n="p1f2"></li><li data-i18n="p1f3"></li><li data-i18n="p1f4"></li></ul>
            </div>
            <div class="plan featured tilt">
              <h3 data-i18n="p2h"></h3>
              <p data-i18n="p2p"></p>
              <div class="price"><small data-i18n="from"></small> €150 – 300 <span class="usd">≈ $170 – 340</span></div>
              <ul><li data-i18n="p2f1"></li><li data-i18n="p2f2"></li><li data-i18n="p2f3"></li><li data-i18n="p2f4"></li><li data-i18n="p2f5"></li></ul>
            </div>
            <div class="plan tilt">
              <h3 data-i18n="p3h"></h3>
              <p data-i18n="p3p"></p>
              <div class="price"><small data-i18n="from"></small> €500 – 1000+ <span class="usd">≈ $550 – 1100+</span></div>
              <ul><li data-i18n="p3f1"></li><li data-i18n="p3f2"></li><li data-i18n="p3f3"></li><li data-i18n="p3f4"></li></ul>
            </div>
          </div>
          <p class="fx" data-i18n="fx"></p>
          <h3 class="terms-title" data-i18n="terms_h"></h3>
          <div class="terms">
            <div><h4 data-i18n="t1h"></h4><p data-i18n="t1p"></p></div>
            <div><h4 data-i18n="t2h"></h4><p data-i18n="t2p"></p></div>
            <div><h4 data-i18n="t3h"></h4><p data-i18n="t3p"></p></div>
            <div><h4 data-i18n="t4h"></h4><p data-i18n="t4p"></p></div>
          </div>
        </section>

        <section id="process">
          <h2 data-i18n="process_h"></h2>
          <p class="lead" data-i18n="process_lead"></p>
          <ol class="steps">
            <li class="tilt"><h3 data-i18n="st1h"></h3><p data-i18n="st1p"></p></li>
            <li class="tilt"><h3 data-i18n="st2h"></h3><p data-i18n="st2p"></p></li>
            <li class="tilt"><h3 data-i18n="st3h"></h3><p data-i18n="st3p"></p></li>
            <li class="tilt"><h3 data-i18n="st4h"></h3><p data-i18n="st4p"></p></li>
          </ol>
        </section>

        <section id="contact" class="contact">
          <div class="c-info">
            <h2 data-i18n="contact_h"></h2>
            <p class="lead" data-i18n="contact_lead"></p>
          </div>
          <form class="form" id="form" novalidate>
            <div class="row">
              <label><span data-i18n="f_name"></span><input name="name" type="text" required autocomplete="name" maxlength="80" /></label>
              <label><span data-i18n="f_email"></span><input name="email" type="email" required autocomplete="email" maxlength="120" /></label>
            </div>
            <label><span data-i18n="f_tg"></span><input name="contact" type="text" autocomplete="tel" maxlength="80" /></label>
            <div class="row">
              <label><span data-i18n="f_type"></span>
                <select name="type">
                  <option value="" data-i18n="f_choose"></option>
                  <option value="Business card site" data-i18n="s1h"></option>
                  <option value="Landing page" data-i18n="s2h"></option>
                  <option value="Multi-page website" data-i18n="o3"></option>
                  <option value="Online store / catalogue" data-i18n="o4"></option>
                  <option value="Other / not sure" data-i18n="o5"></option>
                </select>
              </label>
              <label><span data-i18n="f_budget"></span>
                <select name="budget">
                  <option value="" data-i18n="f_choose"></option>
                  <option value="Up to $150 / 140 EUR" data-i18n="b1"></option>
                  <option value="$150-350 / 140-320 EUR" data-i18n="b2"></option>
                  <option value="$350-1100 / 320-1000 EUR" data-i18n="b3"></option>
                  <option value="Over $1100 / 1000+ EUR" data-i18n="b4"></option>
                  <option value="Not sure yet" data-i18n="b5"></option>
                </select>
              </label>
            </div>
            <label><span data-i18n="f_msg"></span><textarea name="message" rows="6" required maxlength="3000" data-i18n-ph="f_ph"></textarea></label>
            <input type="text" name="_honey" tabindex="-1" autocomplete="off" class="hp" aria-hidden="true" />
            <button class="btn" type="submit" id="send" data-i18n="f_send"></button>
            <p class="status" id="status" role="status" aria-live="polite"></p>
          </form>
        </section>
      </main>

      <footer>
        <div class="f-top">
          <a class="logo" href="#top" aria-label="Lyvero Studio">
            <svg class="mark" viewBox="0 0 573 495" aria-hidden="true">
              <path fill="#fff" d="M0 0H60A97 97 0 0 1 157 97V334H357V495H0Z" />
              <rect class="sq" x="409" y="334" width="164" height="161" />
            </svg>
            <span>Lyvero Studio</span>
          </a>
          <ul class="social" aria-label="Social">
            <li><a href="https://www.facebook.com/profile.php?id=61595492312545&locale=ru_RU" aria-label="Facebook"><svg viewBox="0 0 24 24"><path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.3v7A10 10 0 0 0 22 12z" /></svg></a></li>
            <li><a href="https://www.instagram.com/lyverostudio/" aria-label="Instagram"><svg viewBox="0 0 24 24"><path d="M7.8 2h8.4A5.8 5.8 0 0 1 22 7.8v8.4a5.8 5.8 0 0 1-5.8 5.8H7.8A5.8 5.8 0 0 1 2 16.2V7.8A5.8 5.8 0 0 1 7.8 2zm-.2 2A3.6 3.6 0 0 0 4 7.6v8.8A3.6 3.6 0 0 0 7.6 20h8.8a3.6 3.6 0 0 0 3.6-3.6V7.6A3.6 3.6 0 0 0 16.4 4H7.6zM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm5.2-3.2a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4z" /></svg></a></li>
            <li><a href="https://www.tiktok.com/@lyvero.studio?_r=1&_t=ZN-9BOS81VlARC" aria-label="TikTok"><svg viewBox="0 0 24 24"><path d="M16.6 2h-3.2v12.4a2.6 2.6 0 1 1-2.6-2.6c.3 0 .5 0 .8.1V8.6a5.9 5.9 0 1 0 5 5.8V8.1a7.4 7.4 0 0 0 4.3 1.4V6.3A4.3 4.3 0 0 1 16.6 2z" /></svg></a></li>
          </ul>
        </div>
        <div class="f-bot">© <span id="y"></span> Lyvero Studio. <span data-i18n="rights"></span></div>
      </footer>
    </div>
    <script src="script.js"></script>
  </body>
</html>
